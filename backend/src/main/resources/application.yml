# Base configuration, active in all profiles.
# Local (non-docker) development defaults assume Postgres reachable on localhost,
# e.g. `docker compose up db` run standalone against the same schema.
spring:
  application:
    name: chat-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chat}
    username: ${SPRING_DATASOURCE_USERNAME:chat}
    password: ${SPRING_DATASOURCE_PASSWORD:chat}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: chat-hikari
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE:2}
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 1800000
      idle-timeout: 600000

  jpa:
    # Greenfield MVP: let Hibernate own schema evolution (see design.md).
    # Revisit with Flyway/Liquibase migrations if scope grows beyond the take-home.
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.example.chat: DEBUG

# Application-level tunables referenced by later work packages (message length, etc.)
app:
  messaging:
    max-content-length: 4000
