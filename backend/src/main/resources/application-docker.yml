# Active when the backend runs inside docker-compose (SPRING_PROFILES_ACTIVE=docker).
# All values are still overridable via env vars set in docker-compose.yml so the
# datasource connection is fully externalized rather than hardcoded here.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/chat}
    username: ${SPRING_DATASOURCE_USERNAME:chat}
    password: ${SPRING_DATASOURCE_PASSWORD:chat}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.example.chat: INFO
